name: Scrape Leaderboard

on:
  schedule:
    - cron: '0 * * * *'  # Hourly, on the hour (UTC)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run scraper
        run: yarn scrape

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/leaderboard.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/leaderboard.json
          git commit -m "Update leaderboard data [automated]"
          git push

      # A push made with the default GITHUB_TOKEN does not trigger the deploy
      # workflow, so build and publish here directly when the data changed.
      - name: Build site
        if: steps.changes.outputs.changed == 'true'
        run: yarn build

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
